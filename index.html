    <meta name="referrer" content="strict-origin-when-cross-origin" />
    <script>
      // Apply the saved theme before first paint to avoid a flash of the wrong theme (dark is the default).
      (function () {
        var theme = 'dark';
        try {
          var saved = localStorage.getItem('felipe-resume-theme');
          if (saved === 'light' || saved === 'dark') theme = saved;
        } catch (e) {}
        var root = document.documentElement;
        root.dataset.theme = theme;
        root.style.colorScheme = theme;
        var locale = null;
        try {
          var savedLocale = localStorage.getItem('felipe-resume-locale');
          if (savedLocale === 'pt-BR' || savedLocale === 'en-US') locale = savedLocale;
        } catch (e) {}
        if (!locale) {
          var langs = Array.prototype.slice.call(navigator.languages || []);
          if (navigator.language) langs.push(navigator.language);
          locale = 'en-US';
          for (var i = 0; i < langs.length; i++) {
            var tag = String(langs[i] || '').trim().toLowerCase();
            if (tag.indexOf('pt') === 0) { locale = 'pt-BR'; break; }
            if (tag.indexOf('en') === 0) { locale = 'en-US'; break; }
          }
        }
        root.lang = locale;
      })();
    </script>
